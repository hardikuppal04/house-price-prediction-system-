# Single source of truth for the house-price-prediction project.
# Loaded through the typed dataclass in src/house_price/config.py.

seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures
  mlruns: mlruns

dataset:
  # Ames Housing served by OpenML. 42165 exposes the raw 79-column schema
  # (original names: MSSubClass, OverallQual, GrLivArea, ...).
  name: ames
  openml_id: 42165
  openml_version: 1
  target: SalePrice
  raw_filename: ames_raw.parquet

split:
  # Legacy filenames retained for backwards compatibility. The production
  # workflow uses expanding-year CV and reserves all of 2010 as holdout.
  test_size: 0.2
  stratify_bins: 10
  train_filename: train.parquet
  holdout_filename: holdout.parquet

cv:
  n_folds: 5
  shuffle: true

target:
  # Model on log1p(SalePrice); report metrics in both log and dollar space.
  transform: log1p

preprocessing:
  # Drop the 2 documented partial-sale outliers (>4000 sqft, <$300k) from
  # TRAINING data only. Adopted on evidence (M3): Ridge 5-fold log-RMSE
  # 0.13213 -> 0.11402; dataset author flags these sales as non-market.
  drop_partial_sale_outliers: true

# Production validation: 2006->2007, 2006-07->2008, 2006-08->2009; test=2010.
