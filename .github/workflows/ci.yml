name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ui,tracking]"
      - run: ruff check .
      - run: black --check .
      - run: python -m mypy --no-incremental src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
      - run: pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t house-price .
      - name: Smoke test API container
        run: |
          docker run --rm -d --name house-price-smoke -p 8000:8000 house-price
          trap 'docker rm -f house-price-smoke' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs house-price-smoke
          exit 1
